# Confere, a cada push e pull request, que as páginas em /en e /es, o sitemap.xml e o core/runtime-strings.js
# estão em dia com as páginas em português (mesmo comando do scripts/README.md). Só lê o repositório; não publica nada.
name: Conferir páginas por idioma

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: node scripts/build-i18n.mjs --check
        run: node scripts/build-i18n.mjs --check
      - name: Teste de identidade (texto PT do strings.js == fontes)
        run: node scripts/build-i18n.mjs --identity
